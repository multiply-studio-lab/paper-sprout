<style>
:root{--ink:#1f2a44;--sub:#5b6478;--line:#c9d3e6;--acc:#2f6fdf;--ok:#2e8b57;--warn:#c9741f;--bad:#c0392b;--bg:#f6f8fc;--cell:24px}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans JP","Segoe UI",sans-serif;color:var(--ink);background:var(--bg);line-height:1.55}
header{background:var(--ink);color:#fff;padding:18px 20px}
header .in,main{max-width:1060px;margin:0 auto}
header h1{margin:0;font-size:22px}
header p{margin:4px 0 0;color:#c8d3ec;font-size:14px}
.langs{float:right}
.langs button{background:transparent;color:#c8d3ec;border:1px solid #4a5a82;border-radius:6px;padding:3px 8px;margin-left:4px;cursor:pointer;font-size:13px}
.langs button.on{background:#fff;color:var(--ink)}
main{padding:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.seg button,.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px}
@media(max-width:860px){.cols{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid #e2e8f3;border-radius:12px;padding:14px}
textarea{width:100%;min-height:260px;font-size:16px;font-family:inherit;border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.stat{flex:1;min-width:110px;background:var(--bg);border-radius:8px;padding:8px 10px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--sub)}
.ok b{color:var(--ok)}.warn b{color:var(--warn)}.bad b{color:var(--bad)}
.meter{height:8px;background:#e7ecf5;border-radius:4px;position:relative;margin:4px 0 2px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--acc)}
.meter s{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.notes{font-size:13px;color:var(--sub);margin:6px 0 0;padding-left:18px}
.notes li.w{color:var(--warn)}
.gridwrap{overflow-x:auto}
table.g{border-collapse:collapse;margin:0 auto}
table.g td{width:var(--cell);height:calc(var(--cell)*1.15);border:1px solid var(--line);text-align:center;font-size:calc(var(--cell)*.62);padding:0;white-space:nowrap;overflow:hidden}
table.g td.pair{font-size:calc(var(--cell)*.45);letter-spacing:-.5px}
table.g td.merged{font-size:calc(var(--cell)*.5)}
table.g td.indent{background:#fbfcfe}
table.g tr td:last-child{border-right:1px solid var(--line)}
table.g td.mk{border:none;width:34px;font-size:10px;color:var(--sub);text-align:left;padding-left:4px}
table.g tr.lim td:not(.mk){border-bottom:2px solid var(--acc)}
.prompt{background:var(--bg);border-left:4px solid var(--acc);border-radius:6px;padding:10px 12px;font-size:14px}
.prompt .q{font-weight:700;margin-bottom:6px}
.prompt ul{margin:6px 0 0;padding-left:18px}
.box{display:inline-block;vertical-align:top;border:1px solid var(--line);border-radius:6px;padding:4px 10px;margin:6px 6px 0 0;font-size:13px}
.box b{color:#e0773a}
details{margin-top:8px}
summary{cursor:pointer;color:var(--acc);font-size:14px}
.model{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;margin-top:6px;white-space:pre-wrap}
.cta{margin-top:16px;background:var(--ink);color:#fff;border-radius:12px;padding:14px 16px}
.cta a{color:#fff;background:var(--acc);padding:7px 12px;border-radius:8px;text-decoration:none;display:inline-block;margin:6px 6px 0 0;font-size:14px}
.rules{font-size:13.5px}
.rules li{margin:3px 0}
footer{max-width:1060px;margin:10px auto 30px;padding:0 16px;font-size:12px;color:var(--sub)}
.timer b{font-variant-numeric:tabular-nums}
@media print{
  header,.bar,.no-print,footer,.cta,textarea,.stats,.notes,details{display:none!important}
  body{background:#fff}.card{border:none;padding:0}.cols{display:block}
  :root{--cell:6.6mm}
}
</style>

<script>// TOPIK wongoji layout engine. Rules follow the TOPIK manuscript-paper guide:
// one character per cell; first cell of each paragraph left blank; a line inside a paragraph never
// starts with a blank cell; two Arabic numerals (or two lowercase Latin letters) share a cell;
// uppercase letters take a cell each; punctuation takes its own cell; no blank cell after . or ,;
// a blank cell after ? and !; ellipsis and dash take two cells; a . or , that would start a line
// is written in the last cell of the previous line.
(function (root) {
  function units(par) {
    var u = [], i = 0, s = par.replace(/\t/g, ' ');
    while (i < s.length) {
      var c = s[i];
      if (/[0-9]/.test(c)) { // number run, decimal point / thousands comma kept inside the run
        var j = i; while (j < s.length && (/[0-9]/.test(s[j]) || (/[.,]/.test(s[j]) && /[0-9]/.test(s[j + 1] || '') && /[0-9]/.test(s[j - 1] || '')))) j++;
        var run = s.slice(i, j); for (var k = 0; k < run.length; k += 2) u.push({ t: 'pair', v: run.slice(k, k + 2) });
        i = j; continue;
      }
      if (/[a-z]/.test(c)) {
        var j2 = i; while (j2 < s.length && /[a-z]/.test(s[j2])) j2++;
        var r2 = s.slice(i, j2); for (var k2 = 0; k2 < r2.length; k2 += 2) u.push({ t: 'pair', v: r2.slice(k2, k2 + 2) });
        i = j2; continue;
      }
      if (c === '…' || s.slice(i, i + 3) === '...') { u.push({ t: 'two', v: '…' }); i += (c === '…' ? 1 : 3); continue; }
      if (c === '—' || c === '―' || s.slice(i, i + 2) === '--') { u.push({ t: 'two', v: '―' }); i += (s.slice(i, i + 2) === '--' ? 2 : 1); continue; }
      if (c === ' ') {
        while (s[i + 1] === ' ') i++;
        var prev = u[u.length - 1];
        if (prev && prev.t === 'punct' && (prev.v === '.' || prev.v === ',')) { i++; continue; } // no blank after . ,
        u.push({ t: 'space', v: '' }); i++; continue;
      }
      if (/[.,?!:;'"‘’“”()]/.test(c)) { u.push({ t: 'punct', v: c }); i++; continue; }
      u.push({ t: 'char', v: c }); i++;
    }
    while (u.length && u[u.length - 1].t === 'space') u.pop();
    return u;
  }

  // returns {rows: [[{v, kind}]], used: number of cells up to the last written cell}
  function layout(text, cols) {
    cols = cols || 25;
    var rows = [], row = null, used = 0;
    function newRow() { row = []; rows.push(row); }
    var pars = text.replace(/\r/g, '').split('\n').map(function (p) { return p.replace(/^\s+/, ''); }).filter(function (p) { return p.length; });
    pars.forEach(function (p) {
      newRow();
      row.push({ v: '', kind: 'indent' });
      units(p).forEach(function (un) {
        if (row.length === cols) {
          // a period or comma never starts a line: put it in the last cell of this line
          if (un.t === 'punct' && (un.v === '.' || un.v === ',')) { var last = row[row.length - 1]; last.v += un.v; last.kind = 'merged'; return; }
          newRow();
          if (un.t === 'space') return; // a line inside a paragraph never starts with a blank
        }
        if (un.t === 'two') { row.push({ v: un.v, kind: 'two' }); if (row.length === cols) newRow(); row.push({ v: un.v, kind: 'two' }); return; }
        row.push({ v: un.v, kind: un.t });
      });
    });
    // used = cells up to and including the last non-blank cell
    for (var r = 0; r < rows.length; r++) {
      for (var c2 = 0; c2 < rows[r].length; c2++) if (rows[r][c2].kind !== 'space' && rows[r][c2].kind !== 'indent') used = r * cols + c2 + 1;
    }
    return { rows: rows, used: used };
  }
  root.Wongoji = { units: units, layout: layout };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
var LINKS = {"sample": "", "q51": "", "q53": "", "q54": "", "bundle": ""};
var CONTENT = {"drills": [{"id": 1, "topic": "1인 가구 비율의 변화", "charts": [{"type": "line", "title": "전체 가구 중 1인 가구 비율", "x": ["2005", "2015", "2025"], "y": [20, 27, 36], "unit": "%"}], "boxes": [["원인", ["결혼 연령 상승", "고령화로 혼자 사는 노인 증가"]], ["전망", ["2040년 43% 예상"]]], "answer": "한국생활연구소의 조사에 따르면 전체 가구 중 1인 가구가 차지하는 비율은 2005년 20%에서 2015년 27%로 증가하였고, 2025년에는 36%로 크게 늘어난 것으로 나타났다. 20년 사이에 1인 가구의 비율이 16%p 높아진 것이다. 이렇게 1인 가구가 증가한 원인으로는 결혼 연령이 높아진 것과 고령화로 인해 혼자 사는 노인이 많아진 것을 들 수 있다. 이러한 추세가 계속된다면 2040년에는 1인 가구의 비율이 43%에 이를 것으로 전망된다."}, {"id": 2, "topic": "반려동물 양육 가구의 증가", "charts": [{"type": "bar", "title": "반려동물 양육 가구 수", "x": ["2016", "2020", "2024"], "y": [500, 600, 700], "unit": "만 가구"}], "boxes": [["원인", ["1인 가구 증가", "정서적 안정 추구"]], ["영향", ["반려동물 관련 산업 성장"]]], "answer": "한국생활연구소에서 반려동물을 기르는 가구 수를 조사한 결과, 2016년 500만 가구에서 2020년 600만 가구, 2024년 700만 가구로 꾸준히 증가한 것으로 나타났다. 4년마다 100만 가구씩 늘어 8년 동안 모두 200만 가구가 증가한 것이다. 이처럼 반려동물 양육 가구가 늘어난 이유는 1인 가구가 증가하고 반려동물을 통해 정서적 안정을 얻으려는 사람이 많아졌기 때문이다. 이에 따라 반려동물 관련 산업도 함께 성장하고 있다."}, {"id": 3, "topic": "종이 신문 구독률의 감소", "charts": [{"type": "line", "title": "종이 신문 구독 가구 비율", "x": ["2010", "2017", "2024"], "y": [50, 25, 8], "unit": "%"}], "boxes": [["원인", ["스마트폰 보급", "무료 온라인 뉴스"]], ["전망", ["온라인 유료 구독 서비스 강화"]]], "answer": "한국생활연구소의 조사에 따르면 종이 신문을 구독하는 가구의 비율은 2010년 50%에서 2017년 25%로 떨어져 절반 수준이 되었고, 2024년에는 8%에 불과한 것으로 나타났다. 14년 사이에 구독률이 크게 낮아진 것이다. 이렇게 구독률이 감소한 원인으로는 스마트폰이 널리 보급되었다는 점과 온라인에서 뉴스를 무료로 볼 수 있다는 점을 들 수 있다. 앞으로는 온라인 유료 구독 서비스가 더욱 강화될 것으로 전망된다."}], "essays": [{"id": 1, "topic": "인공지능 시대에 필요한 능력", "intro": "인공지능 기술이 빠르게 발전하면서 많은 일이 자동화되고 있다. 아래의 내용을 중심으로 '인공지능 시대에 필요한 능력'에 대한 자신의 생각을 쓰라.", "questions": ["인공지능의 발전이 우리 삶에 가져온 변화는 무엇인가?", "인공지능 시대에 사람에게 필요한 능력은 무엇인가?", "그러한 능력을 기르기 위해 어떤 노력이 필요한가?"], "answer": "최근 인공지능이 일상과 일터에서 널리 쓰이면서 우리의 삶은 크게 달라지고 있다. 과거에는 사람이 직접 해야 했던 번역, 자료 정리, 고객 상담 같은 일을 이제는 인공지능이 짧은 시간 안에 처리한다. 덕분에 일의 효율은 높아졌지만, 한편으로는 사람의 일자리가 줄어들 것이라는 걱정도 커지고 있다. 이처럼 인공지능은 우리 생활을 편리하게 만들었지만, 동시에 사람이 어떤 능력을 갖추어야 하는지에 대한 새로운 질문을 던지고 있다.\n이러한 시대에 사람이 갖추어야 할 능력은 크게 두 가지이다. 첫째, 비판적으로 생각하는 능력이다. 인공지능이 내놓는 정보가 항상 정확한 것은 아니기 때문에 그 내용이 맞는지 판단하고 올바르게 활용할 수 있어야 한다. 둘째, 다른 사람과 소통하고 협력하는 능력이다. 기계가 많은 일을 대신하더라도 사람의 마음을 이해하고 함께 문제를 해결하는 일은 여전히 사람의 몫이다.\n이러한 능력을 기르기 위해서는 먼저 정답을 외우는 교육에서 벗어나 스스로 질문하고 토론하는 교육이 이루어져야 한다. 또한 개인도 새로운 기술을 두려워하기보다 적극적으로 배우고, 그 기술을 어떻게 사용해야 하는지 고민하는 태도를 가져야 한다. 인공지능은 사람을 대신하는 존재가 아니라 사람의 능력을 넓혀 주는 도구가 되어야 한다고 생각한다."}, {"id": 2, "topic": "칭찬의 효과와 올바른 칭찬 방법", "intro": "칭찬은 사람을 움직이는 힘이 있다고 한다. 그러나 잘못된 칭찬은 오히려 부정적인 결과를 가져오기도 한다. 아래의 내용을 중심으로 '칭찬의 효과와 올바른 칭찬 방법'에 대한 자신의 생각을 쓰라.", "questions": ["칭찬은 어떤 긍정적인 효과가 있는가?", "잘못된 칭찬은 어떤 문제를 일으키는가?", "올바르게 칭찬하려면 어떻게 해야 하는가?"], "answer": "칭찬은 듣는 사람에게 자신감을 주고 새로운 일에 도전할 수 있는 힘을 준다. 특히 아이들은 부모나 선생님에게 칭찬을 받으면 자신이 인정받았다고 느끼고 공부나 활동에 더 큰 관심을 갖게 된다. 직장에서도 동료나 상사의 칭찬은 일에 대한 동기를 높이고 서로의 관계를 좋게 만든다. 이처럼 칭찬은 사람의 마음을 움직여 스스로 더 잘하고 싶다는 생각을 하게 만든다.\n그러나 모든 칭찬이 좋은 결과를 가져오는 것은 아니다. 노력보다 타고난 능력만 칭찬하면 듣는 사람은 실패를 두려워하게 되고 어려운 일을 피하려고 할 수 있다. 또한 마음에 없는 칭찬을 지나치게 자주 하면 칭찬의 가치가 떨어지고, 상대방은 그 말을 진심으로 받아들이지 않게 된다. 결과만 칭찬받은 사람은 다음에도 좋은 결과를 내야 한다는 부담 때문에 오히려 불안해질 수도 있다.\n따라서 올바르게 칭찬하기 위해서는 결과보다 과정을 칭찬하는 것이 중요하다. 예를 들어 \"머리가 좋구나\"보다 \"끝까지 열심히 노력했구나\"라고 말하면 상대방은 노력의 가치를 배우게 된다. 그리고 막연하게 \"잘했다\"라고 말하기보다 무엇을 잘했는지 구체적으로 말해 주어야 한다. 칭찬할 때 다른 사람과 비교하지 않는 것도 중요하다. 이처럼 진심을 담아 구체적으로 칭찬한다면 칭찬은 사람을 성장시키는 좋은 도구가 될 것이다."}]};

var COLS = 25, MODES = {q53:[200,300,15], q54:[600,700,30], free:[0,0,30]};
var st = {lang:'en', mode:'q53', prompt:-1, left:900, run:false, timer:null};
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function t(k){return (T[st.lang]&&T[st.lang][k])||T.en[k]||k}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function chartSVG(c){
  var W=360,H=170,P=30,x=c.x,y=c.y||null,series=c.series||null,u=c.unit,out='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+esc(c.title)+'"><text x="4" y="14" font-size="12" font-weight="700" fill="#1f2a44">'+esc(c.title)+'</text>';
  function fmt(v){return String(v).replace(/\B(?=(\d{3})+(?!\d))/g,',')+u}
  if(c.type==='hbar'){var mx=Math.max.apply(null,y);x.forEach(function(l,i){var yy=28+i*(H-36)/x.length,w=(W-170)*y[i]/mx;out+='<text x="4" y="'+(yy+12)+'" font-size="10">'+esc(l)+'</text><rect x="150" y="'+(yy+2)+'" width="'+w+'" height="14" fill="#2f6fdf"/><text x="'+(154+w)+'" y="'+(yy+13)+'" font-size="10" font-weight="700">'+fmt(y[i])+'</text>'});return out+'</svg>'}
  if(c.type==='pie'){var tot=y.reduce(function(a,b){return a+b},0),a0=-Math.PI/2,cols=['#2f6fdf','#e0773a','#4aa37a','#8a63c9','#9aa3b5'];y.forEach(function(v,i){var a1=a0+2*Math.PI*v/tot,lg=(a1-a0)>Math.PI?1:0,cx=90,cy=95,r=58;out+='<path d="M'+cx+','+cy+' L'+(cx+r*Math.cos(a0))+','+(cy+r*Math.sin(a0))+' A'+r+','+r+' 0 '+lg+' 1 '+(cx+r*Math.cos(a1))+','+(cy+r*Math.sin(a1))+' Z" fill="'+cols[i]+'"/>';out+='<rect x="175" y="'+(32+i*20)+'" width="10" height="10" fill="'+cols[i]+'"/><text x="190" y="'+(41+i*20)+'" font-size="11">'+esc(x[i])+' '+fmt(v)+'</text>';a0=a1});return out+'</svg>'}
  var sets=series?Object.keys(series).map(function(k){return [k,series[k]]}):[[null,y]],all=[].concat.apply([],sets.map(function(s){return s[1]})),mx2=Math.max.apply(null,all)*1.25,n=x.length,cw=(W-2*P)/n,colr=['#2f6fdf','#e0773a'];
  function Y(v){return H-22-(H-50)*v/mx2}
  sets.forEach(function(s,si){
    var pts=[];x.forEach(function(l,i){var cx=P+cw*i+cw/2,yy=Y(s[1][i]);
      if(c.type==='bar'||c.type==='groupbar'){var bw=cw*0.6/sets.length,bx=P+cw*i+cw*0.2+bw*si;out+='<rect x="'+bx+'" y="'+yy+'" width="'+bw+'" height="'+(H-22-yy)+'" fill="'+colr[si]+'"/><text x="'+(bx+bw/2)+'" y="'+(yy-3)+'" font-size="9" text-anchor="middle">'+fmt(s[1][i])+'</text>'}
      else{pts.push(cx+','+yy);out+='<circle cx="'+cx+'" cy="'+yy+'" r="3" fill="'+colr[si]+'"/><text x="'+cx+'" y="'+(yy-6)+'" font-size="9" text-anchor="middle">'+fmt(s[1][i])+'</text>'}});
    if(pts.length)out+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+colr[si]+'" stroke-width="2"/>';
    if(s[0])out+='<rect x="'+(W-110)+'" y="'+(6+si*14)+'" width="9" height="9" fill="'+colr[si]+'"/><text x="'+(W-97)+'" y="'+(14+si*14)+'" font-size="10">'+esc(s[0])+'</text>';
  });
  x.forEach(function(l,i){out+='<text x="'+(P+cw*i+cw/2)+'" y="'+(H-6)+'" font-size="10" text-anchor="middle">'+esc(l)+'</text>'});
  return out+'<line x1="'+P+'" y1="'+(H-22)+'" x2="'+(W-P)+'" y2="'+(H-22)+'" stroke="#c9d3e6"/></svg>';
}

function renderPrompt(){
  var el=document.getElementById('promptcard');
  if(st.prompt<0||st.mode==='free'){el.innerHTML='<div class="prompt">'+esc(t('noprompt'))+'</div>';return}
  var h='';
  if(st.mode==='q53'){var d=CONTENT.drills[st.prompt];
    h+='<div class="prompt"><div class="q">'+esc("다음은 '"+d.topic+"'에 대한 자료이다. 이 내용을 200~300자의 글로 쓰시오. 단, 글의 제목은 쓰지 마시오. (30점)")+'</div>';
    d.charts.forEach(function(c){h+=chartSVG(c)});
    d.boxes.forEach(function(b){h+='<span class="box"><b>'+esc(b[0])+'</b> '+esc(b[1].join(' · '))+'</span>'});
    h+='<div style="font-size:11px;color:#5b6478;margin-top:4px">'+esc(t('fict'))+'</div></div>';
    h+='<details><summary>'+esc(t('model'))+'</summary><div class="model">'+esc(d.answer)+'</div></details>';
  }else{var e=CONTENT.essays[st.prompt];
    h+='<div class="prompt"><div class="q">'+esc('다음을 참고하여 600~700자로 글을 쓰시오. 단, 문제를 그대로 옮겨 쓰지 마시오. (50점)')+'</div>'+esc(e.intro)+'<ul>'+e.questions.map(function(q){return '<li>'+esc(q)+'</li>'}).join('')+'</ul></div>';
    h+='<details><summary>'+esc(t('model'))+'</summary><div class="model">'+esc(e.answer)+'</div></details>';
  }
  el.innerHTML=h;
}

function render(){
  var text=document.getElementById('ta').value, L=Wongoji.layout(text,COLS), m=MODES[st.mode];
  var rowsNeeded=Math.max(L.rows.length, m[1]?Math.ceil(m[1]/COLS):12, 8);
  var g='';
  for(var r=0;r<rowsNeeded;r++){
    var row=L.rows[r]||[], lim=m[1]&&((r+1)*COLS===m[0]||(r+1)*COLS===m[1]);
    g+='<tr'+(lim?' class="lim"':'')+'>';
    for(var c=0;c<COLS;c++){var cell=row[c];g+='<td class="'+(cell?cell.kind:'')+'">'+(cell?esc(cell.v):'')+'</td>'}
    g+='<td class="mk">'+(((r+1)*COLS)%50===0?(r+1)*COLS:'')+'</td></tr>';
  }
  document.getElementById('grid').innerHTML=g;
  var u=L.used, s=document.getElementById('s_used');
  s.querySelector('b').textContent=u; s.querySelector('span').textContent=t('used');
  var need=document.getElementById('s_need');
  if(m[1]){
    var cls=u<m[0]?(u<m[0]*0.9?'bad':'warn'):(u>m[1]?'bad':'ok');
    s.className='stat '+cls;
    need.querySelector('b').textContent=m[0]+'–'+m[1];
    need.querySelector('span').textContent=u<m[0]?t('more').replace('{n}',m[0]-u):(u>m[1]?t('over').replace('{n}',u-m[1]):t('inrange'));
    var mi=document.getElementById('meter');mi.style.display='';
    mi.innerHTML='<i style="width:'+Math.min(100,u/m[1]*100)+'%;background:'+(cls==='ok'?'#2e8b57':cls==='warn'?'#c9741f':'#c0392b')+'"></i><s style="left:'+(m[0]/m[1]*100)+'%"></s>';
  }else{s.className='stat';need.querySelector('b').textContent='—';need.querySelector('span').textContent=t('freemode');document.getElementById('meter').style.display='none'}
  var rs=document.getElementById('s_rows');rs.querySelector('b').textContent=L.rows.length;rs.querySelector('span').textContent=t('rows');
  var notes=[], polite=(text.match(/(요|니다)[.?!]/g)||[]).length;
  if(polite&&st.mode!=='free')notes.push(['w',t('polite').replace('{n}',polite)]);
  if(/\.\s/.test(text))notes.push(['',t('nospace')]);
  if(/[0-9]{2}/.test(text))notes.push(['',t('digits')]);
  if(/\?|!/.test(text))notes.push(['',t('qmark')]);
  if(st.mode==='q53'&&text.split('\n').filter(function(p){return p.trim()}).length>1)notes.push(['',t('onepara')]);
  if(st.mode==='q54'&&u>200&&text.split('\n').filter(function(p){return p.trim()}).length<3)notes.push(['w',t('threepara')]);
  document.getElementById('notes').innerHTML=notes.map(function(n){return '<li class="'+n[0]+'">'+esc(n[1])+'</li>'}).join('');
  store('wg_'+st.mode,text);
}

function setMode(m){st.mode=m;st.prompt=-1;document.getElementById('ta').value=store('wg_'+m)||'';resetTimer();ui()}
function resetTimer(){st.run=false;clearInterval(st.timer);st.left=MODES[st.mode][2]*60;clock()}
function clock(){var mm=Math.floor(st.left/60),ss=st.left%60;document.getElementById('tclock').textContent=(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;document.getElementById('tbtn').textContent=st.run?t('pause'):t('start')}
function tick(){if(st.left>0){st.left--;clock()}if(st.left===0){st.run=false;clearInterval(st.timer);clock()}}

function ui(){
  document.documentElement.lang=st.lang;
  document.getElementById('t_title').textContent=t('title');document.getElementById('t_sub').textContent=t('sub');
  document.getElementById('langs').innerHTML=[['en','EN'],['vi','VI'],['ja','日本語'],['ko','한국어']].map(function(l){return '<button data-l="'+l[0]+'" class="'+(st.lang===l[0]?'on':'')+'">'+l[1]+'</button>'}).join('');
  document.getElementById('modes').innerHTML=[['q53','Q53 · 200–300'],['q54','Q54 · 600–700'],['free',t('free')]].map(function(m){return '<button data-m="'+m[0]+'" class="'+(st.mode===m[0]?'on':'')+'">'+m[1]+'</button>'}).join('');
  ['tbtn','treset','bprompt','bprint','bclear'].forEach(function(id){});
  document.getElementById('treset').textContent=t('reset');document.getElementById('bprompt').textContent=t('prompt');document.getElementById('bprint').textContent=t('print');document.getElementById('bclear').textContent=t('clear');
  document.getElementById('ta').placeholder=t('ph');
  document.getElementById('t_rules').textContent=t('rulesh');
  document.getElementById('rules').innerHTML=t('rules').map(function(r){return '<li>'+esc(r)+'</li>'}).join('');
  var links=Object.keys(LINKS).filter(function(k){return LINKS[k]});
  document.getElementById('cta').innerHTML='<b>'+esc(t('ctah'))+'</b><div style="font-size:14px;color:#c8d3ec;margin-top:4px">'+esc(t('ctap'))+'</div>'+(links.length?links.map(function(k){return '<a href="'+esc(LINKS[k])+'" target="_blank" rel="noopener">'+esc(t('l_'+k))+'</a>'}).join(''):'<div style="margin-top:6px;font-size:13px">'+esc(t('soon'))+'</div>');
  document.getElementById('foot').textContent=t('foot');
  clock();renderPrompt();render();
}

document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.dataset.l){st.lang=b.dataset.l;store('wg_lang',st.lang);ui()}
  else if(b.dataset.m){setMode(b.dataset.m)}
  else if(b.id==='tbtn'){st.run=!st.run;clearInterval(st.timer);if(st.run)st.timer=setInterval(tick,1000);clock()}
  else if(b.id==='treset'){resetTimer()}
  else if(b.id==='bprompt'){var n=st.mode==='q53'?CONTENT.drills.length:st.mode==='q54'?CONTENT.essays.length:0;if(n){st.prompt=(st.prompt+1)%n;renderPrompt()}}
  else if(b.id==='bprint'){window.print()}
  else if(b.id==='bclear'){if(document.getElementById('ta').value&&!window.__cl){window.__cl=1;b.textContent=t('sure');setTimeout(function(){window.__cl=0;b.textContent=t('clear')},2500);return}window.__cl=0;document.getElementById('ta').value='';render();b.textContent=t('clear')}
});
document.getElementById('ta').addEventListener('input',render);
(function init(){var L=store('wg_lang'),page='en';st.lang=L||page;document.getElementById('ta').value=store('wg_q53')||'';resetTimer();ui()})();
</script>
</body>
</html>
